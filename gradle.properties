# Gradle 默认 JVM 内存设置，可通过用户或命令行参数覆盖
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 禁止 Gradle 自动下载其它 JDK
org.gradle.java.installations.auto-download=false

# Jvm
jvmVersion=25
# Minecraft
minecraftVersion=26.1.2
minecraftVersionRange=[26.1.2,26.2)
# NeoForge
neoforgeVersion=26.1.2.122
neoforgeVersionRange=[26.1.2.122,)
# KotlinForForge
kffVersion=6.4.0
kffVersionRange=[6.4.0,)

## 模组属性
modId=graft
modName=Graft
modVersion=1.0.0
modGroupId=cn.mykodb.graft
modAuthors=mykodb
modLicense=All Rights Reserved
modDescription=...
